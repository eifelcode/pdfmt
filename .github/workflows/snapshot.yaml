name: snapshot

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update
            sudo apt-get install -y \
              shellcheck \
              ocrmypdf \
              qpdf \
              jq \
              poppler-utils \
              sane-utils \
              imagemagick

          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            brew install \
              bash \
              shellcheck \
              ocrmypdf \
              poppler \
              qpdf \
              jq \
              sane-backends \
              imagemagick
          fi

      - name: Install bashunit
        shell: bash
        env:
          # Keep in sync with BASHUNIT_VERSION in the Makefile
          BASHUNIT_VERSION: "0.53.0"
          # Fail if the checksum of the downloaded binary can not be verified
          BASHUNIT_VERIFY_CHECKSUM: "true"
        run: |
          # Download the installer first (and fail on HTTP errors) instead of piping it blindly into bash
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/install-bashunit.sh" https://bashunit.com/install.sh
          bash "${RUNNER_TEMP}/install-bashunit.sh" "${BASHUNIT_VERSION}"

      - name: Show Bash version
        shell: bash
        run: |
          echo "Bash:"
          bash --version
          echo
          echo "Path:"
          command -v bash

      - name: Build and test
        shell: bash
        run: make test
